<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenWeb AI Reading Deck</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="zw-sidepanel-app">
    <!-- Header -->
    <header class="zw-sp-header">
      <div class="zw-sp-title-area">
        <div class="zw-sp-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#00FF66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(0, 255, 102, 0.15)"/>
          </svg>
        </div>
        <div>
          <h2>ZENWEB AI DECK</h2>
          <span class="zw-sp-subtitle">[READING CO-PILOT]</span>
        </div>
      </div>
      <button class="zw-sp-icon-btn" id="btn-refresh-context" title="Refresh Active Tab Context">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#f4f6fb" stroke-width="2">
          <path d="M21 12a9 9 0 00-15.5-6.4L3 8m0-4v4h4M3 12a9 9 0 0015.5 6.4L21 16m0 4v-4h-4" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Context Pill -->
    <div class="zw-sp-context-card">
      <div class="zw-sp-context-header">
        <span class="zw-sp-pulse-dot"></span>
        <span class="zw-sp-context-label">ACTIVE PAGE CONTEXT</span>
      </div>
      <div class="zw-sp-page-title" id="sp-page-title">Syncing active page...</div>
    </div>

    <!-- Quick Action Chips (SVG vector icons, no emojis) -->
    <div class="zw-sp-quick-chips">
      <button class="zw-sp-chip" data-action="summary">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#00FF66" stroke-width="2"/>
        </svg>
        <span>[3-BULLET CORE]</span>
      </button>
      <button class="zw-sp-chip" data-action="adhd">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
          <rect x="3" y="4" width="18" height="6.5" rx="1.5" stroke="#FF007A" stroke-width="1.6"/>
          <rect x="3" y="13.5" width="18" height="6.5" rx="1.5" stroke="#00FF66" stroke-width="1.6"/>
        </svg>
        <span>[SCANNABLE BULLETS]</span>
      </button>
      <button class="zw-sp-chip" data-action="tone">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
          <path d="M12 3L6 11a7 7 0 1012 0L12 3z" stroke="#38BDF8" stroke-width="1.8"/>
        </svg>
        <span>[NEUTRALIZE TONE]</span>
      </button>
      <button class="zw-sp-chip" data-action="actions">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="#00FF66" stroke-width="1.8"/>
        </svg>
        <span>[ACTION ITEMS]</span>
      </button>
    </div>

    <!-- Chat Message Stream -->
    <main class="zw-sp-messages" id="sp-messages">
      <div class="zw-sp-msg zw-sp-assistant">
        <div class="zw-sp-msg-header">
          <span class="zw-sp-avatar">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <rect x="3" y="6" width="18" height="12" rx="3" stroke="#00FF66" stroke-width="2"/>
              <circle cx="12" cy="12" r="2" fill="#FF007A"/>
            </svg>
          </span>
          <span class="zw-sp-sender">ZENWEB AGENT</span>
        </div>
        <div class="zw-sp-msg-body">
          Reading deck initialized. I monitor cognitive pacing, break dense walls of text into actionable bullet points, and answer questions about this page.
        </div>
      </div>
    </main>

    <!-- Input Footer -->
    <footer class="zw-sp-input-area">
      <div class="zw-sp-input-wrapper">
        <textarea
          id="sp-user-input"
          class="zw-sp-textarea"
          placeholder="Ask a question about this page..."
          rows="1"
        ></textarea>
        <button class="zw-sp-send-btn" id="sp-send-btn" title="Send Question">➔</button>
      </div>
      <div class="zw-sp-hint">
        <span>🔒 100% On-device privacy</span>
        <button id="sp-clear-btn" class="zw-sp-clear-link">[CLEAR CHAT]</button>
      </div>
    </footer>
  </div>

  <script src="ai-engine.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
