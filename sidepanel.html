<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenWeb AI Reading Deck</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="zw-sidepanel-app">
    <!-- Header -->
    <header class="zw-sp-header">
      <div class="zw-sp-title-area">
        <div class="zw-sp-icon">⚡</div>
        <div>
          <h2>ZENWEB AI DECK</h2>
          <span class="zw-sp-subtitle">[READING CO-PILOT]</span>
        </div>
      </div>
      <button class="zw-sp-icon-btn" id="btn-refresh-context" title="Refresh Active Tab Context">🔄</button>
    </header>

    <!-- Context Pill -->
    <div class="zw-sp-context-card">
      <div class="zw-sp-context-header">
        <span class="zw-sp-pulse-dot"></span>
        <span class="zw-sp-context-label">ACTIVE PAGE CONTEXT</span>
      </div>
      <div class="zw-sp-page-title" id="sp-page-title">Syncing active page...</div>
    </div>

    <!-- Quick Action Chips -->
    <div class="zw-sp-quick-chips">
      <button class="zw-sp-chip" data-action="summary">
        <span>⚡</span> [3-BULLET CORE]
      </button>
      <button class="zw-sp-chip" data-action="adhd">
        <span>🧩</span> [SCANNABLE BULLETS]
      </button>
      <button class="zw-sp-chip" data-action="tone">
        <span>🕊️</span> [NEUTRALIZE TONE]
      </button>
      <button class="zw-sp-chip" data-action="actions">
        <span>📋</span> [ACTION ITEMS]
      </button>
    </div>

    <!-- Chat Message Stream -->
    <main class="zw-sp-messages" id="sp-messages">
      <div class="zw-sp-msg zw-sp-assistant">
        <div class="zw-sp-msg-header">
          <span class="zw-sp-avatar">🤖</span>
          <span class="zw-sp-sender">ZENWEB AGENT</span>
        </div>
        <div class="zw-sp-msg-body">
          Reading deck initialized. I monitor cognitive pacing, break dense walls of text into actionable bullet points, and answer questions about this page.
        </div>
      </div>
    </main>

    <!-- Input Footer -->
    <footer class="zw-sp-input-area">
      <div class="zw-sp-input-wrapper">
        <textarea
          id="sp-user-input"
          class="zw-sp-textarea"
          placeholder="Ask a question about this page..."
          rows="1"
        ></textarea>
        <button class="zw-sp-send-btn" id="sp-send-btn" title="Send Question">➔</button>
      </div>
      <div class="zw-sp-hint">
        <span>🔒 100% On-device privacy</span>
        <button id="sp-clear-btn" class="zw-sp-clear-link">[CLEAR CHAT]</button>
      </div>
    </footer>
  </div>

  <script src="ai-engine.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
